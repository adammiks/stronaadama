<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z wyobraźni — Biblioteka Adama Miksa</title>
<meta name="description" content="Obrazy z wyobraźni — galeria ilustracji Adama Miksa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Serif+4:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ec;--paper:#fffdf9;--text:#26231f;--muted:#6f685e;--olive:#5f6432;--border:#ddd4c7}*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',serif;line-height:1.7}img{max-width:100%;display:block}a{color:inherit;text-decoration:none}.container{width:min(1200px,92%);margin:0 auto}header{padding:50px 0 30px;text-align:center;border-bottom:1px solid var(--border)}header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3.5rem,7vw,6rem);font-weight:400;line-height:.95}header p{color:var(--muted);margin-top:12px}.gallery{width:min(1150px,92%);margin:70px auto 110px;display:grid;grid-template-columns:repeat(2,1fr);gap:75px 50px}.artwork-image{position:relative;overflow:hidden;background:#e9e4da;cursor:zoom-in}.artwork-image img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .8s ease}.artwork-image:hover img{transform:scale(1.035);filter:brightness(.93)}.artwork-number{display:block;color:var(--muted);font-size:.72rem;letter-spacing:3px;margin:14px 4px 0;text-transform:uppercase}.artwork-title{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:500;padding:5px 4px}.artwork-description{color:var(--muted);font-size:.95rem;font-style:italic;padding:0 4px}.lightbox{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:30px;background:rgba(25,23,20,.95);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}.lightbox.active{opacity:1;visibility:visible}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;box-shadow:0 30px 100px rgba(0,0,0,.5)}.lightbox-close{position:absolute;top:18px;right:28px;border:none;background:transparent;color:white;font-size:46px;font-weight:300;cursor:pointer;opacity:.7}.lightbox-close:hover{opacity:1}footer{border-top:1px solid var(--border);padding:40px 0;text-align:center;color:var(--muted);font-size:.95rem}@media(max-width:800px){.gallery{grid-template-columns:1fr;gap:55px;margin-top:50px}.artwork-image img{aspect-ratio:4/3}}@media(max-width:500px){header{padding-top:35px}.gallery{margin-bottom:70px}}
</style>
</head>
<body>
<header><div class="container"><h1>Moje obrazy</h1><p>Ilustracje z wyobraźni</p></div></header>
<main class="gallery">

<figure class="artwork"><div class="artwork-image" onclick="openLightbox(this)"><img src="Krasnoludek%20piecze%20kie%C5%82bask%C4%99%20nad%20%C5%BCar%C3%B3wk%C4%85.jpg" alt="Grill krasnoludka" loading="lazy"></div><figcaption><span class="artwork-number">01 · Z wyobraźni</span><h2 class="artwork-title">Grill krasnoludka</h2></figcaption></figure>
<figure class="artwork"><div class="artwork-image" onclick="openLightbox(this)"><img src="dziewczyna%20wychyla%20si%C4%99%20jednocze%C5%9Bnie%20z%20jeziora%20i%20obrazu.jpg" alt="Wychodzi z ram jeziora" loading="lazy"></div><figcaption><span class="artwork-number">02 · Z wyobraźni</span><h2 class="artwork-title">Wychodzi z ram jeziora</h2></figcaption></figure>
<figure class="artwork"><div class="artwork-image" onclick="openLightbox(this)"><img src="Oczekiwanie%20na%20przeciwniczk%C4%99.jpg" alt="Gdzie ta moja przeciwniczka" loading="lazy"></div><figcaption><span class="artwork-number">03 · Z wyobraźni</span><h2 class="artwork-title">Gdzie ta moja przeciwniczka</h2></figcaption></figure>
<figure class="artwork"><div class="artwork-image" onclick="openLightbox(this)"><img src=" https://raw.githubusercontent.com/adammiks/stronaadama/refs/heads/main/Krasnoludek%20na%20pustyni%20%20zamawia%20tramwaj%20przez%20smartfon.jpg"  alt="Czy na pustyni jest wi-fi" loading="lazy"></div><figcaption><span class="artwork-number">04 · Z wyobraźni</span><h2 class="artwork-tittle">Czy na pustyni jest wi-fi</h2></figcaption></figure>
<footer><div class="container"><p>Biblioteka Adama Miksa</p><p>© 2026 · Wszelkie prawa zastrzeżone</p></div></footer>
<script>function openLightbox(e){const i=e.querySelector('img');document.getElementById('lightbox-image').src=i.src;document.getElementById('lightbox-image').alt=i.alt;document.getElementById('lightbox').classList.add('active');document.body.style.overflow='hidden'}function closeLightbox(){document.getElementById('lightbox').classList.remove('active');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});</script>
</body></html>
