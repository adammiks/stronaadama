
<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Z wyobraźni — Biblioteka Adama Miksa</title>

<meta name="description" content="Obrazy z wyobraźni — galeria ilustracji Adama Miksa">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Serif+4:wght@300;400;500;600&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   USTAWIENIA
   ===================================================== */

:root {
  --bg: #f7f3ec;
  --paper: #fffdf9;
  --text: #26231f;
  --muted: #6f685e;
  --olive: #5f6432;
  --border: #ddd4c7;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Source Serif 4', serif;
  line-height: 1.7;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1200px, 92%);
  margin: 0 auto;
}



 


/* LOGO */

.logo {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo-circle {
  width: 64px;
  height: 64px;

  border-radius: 50%;
  border: 2px solid #777;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
}

.logo-text h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  line-height: 1;
}

.logo-text p {
  color: var(--muted);
}


/* MENU */

nav {
  display: flex;
  align-items: center;
  gap: 30px;
}

nav a {
  transition: opacity .25s ease;
}

nav a:hover {
  opacity: .55;
}

nav a.active {
  color: var(--olive);
}


/* =====================================================
   INTRO
   ===================================================== */

.gallery-intro {
  padding: 105px 0 80px;
  text-align: center;

  border-bottom: 1px solid var(--border);
}

.gallery-label {
  display: block;

  text-transform: uppercase;
  letter-spacing: 5px;

  color: var(--muted);
  font-size: .85rem;

  margin-bottom: 20px;
}

.gallery-title {
  font-family: 'Cormorant Garamond', serif;

  font-size: clamp(4rem, 8vw, 7rem);
  font-weight: 400;

  line-height: .9;

  margin-bottom: 30px;
}

.gallery-motto {
  font-family: 'Cormorant Garamond', serif;

  font-size: 1.8rem;
  font-style: italic;

  line-height: 1.5;

  color: #4f5631;
}

.gallery-line {
  width: 50px;
  height: 1px;

  background: var(--border);

  margin: 35px auto;
}

.gallery-description {
  max-width: 560px;

  margin: auto;

  color: var(--muted);

  font-size: 1.05rem;
}


/* =====================================================
   GALERIA
   ===================================================== */

.gallery {
  width: min(1150px, 92%);

  margin: 90px auto 130px;

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 90px 50px;
}


/* POJEDYNCZA PRACA */

.artwork {
  margin: 0;
}

.artwork-image {
  position: relative;

  overflow: hidden;

  background: #e9e4da;

  cursor: zoom-in;
}

.artwork-image img {
  width: 100%;

  aspect-ratio: 4 / 3;

  object-fit: cover;

  transition:
    transform .8s cubic-bezier(.2,.7,.2,1),
    filter .8s ease;
}

.artwork-image:hover img {
  transform: scale(1.035);

  filter: brightness(.93);
}


/* PODPIS */

.artwork-caption {
  padding: 18px 4px 0;
}

.artwork-number {
  display: block;

  color: var(--muted);

  font-size: .7rem;

  letter-spacing: 3px;

  margin-bottom: 4px;
}

.artwork-title {
  font-family: 'Cormorant Garamond', serif;

  font-size: 1.7rem;

  font-weight: 500;
}

.artwork-description {
  margin-top: 4px;

  color: var(--muted);

  font-size: .95rem;

  font-style: italic;
}


/* =====================================================
   LIGHTBOX
   ===================================================== */

.lightbox {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 30px;

  background: rgba(25,23,20,.95);

  opacity: 0;

  visibility: hidden;

  transition:
    opacity .3s ease,
    visibility .3s ease;
}

.lightbox.active {
  opacity: 1;

  visibility: visible;
}

.lightbox img {
  max-width: 94vw;
  max-height: 90vh;

  object-fit: contain;

  box-shadow:
    0 30px 100px rgba(0,0,0,.5);
}


/* ZAMKNIĘCIE */

.lightbox-close {
  position: absolute;

  top: 18px;
  right: 28px;

  border: none;

  background: transparent;

  color: white;

  font-size: 46px;
  font-weight: 300;

  cursor: pointer;

  opacity: .7;
}

.lightbox-close:hover {
  opacity: 1;
}


/* =====================================================
   STOPKA
   ===================================================== */

footer {
  border-top: 1px solid var(--border);

  padding: 40px 0;

  text-align: center;

  color: var(--muted);

  font-size: .95rem;
}


/* =====================================================
   TELEFON
   ===================================================== */

@media (max-width: 800px) {

  .navbar {
    min-height: auto;

    padding: 18px 0;

    flex-direction: column;

    gap: 18px;
  }

  nav {
    gap: 18px;

    flex-wrap: wrap;

    justify-content: center;

    font-size: .95rem;
  }

  .gallery-intro {
    padding: 75px 0 60px;
  }

  .gallery-title {
    font-size: 4.5rem;
  }

  .gallery-motto {
    font-size: 1.45rem;
  }

  .gallery {
    grid-template-columns: 1fr;

    gap: 60px;

    margin-top: 65px;
    margin-bottom: 90px;
  }

}


@media (max-width: 500px) {

  .logo-circle {
    width: 54px;
    height: 54px;

    font-size: 1.7rem;
  }

  .logo-text h1 {
    font-size: 1.7rem;
  }

  .gallery-title {
    font-size: 3.7rem;
  }

  .gallery-description {
    font-size: .95rem;
  }

  .lightbox {
    padding: 15px;
  }

}

</style>

</head>




<main>

<div class="gallery">

   <h3> Ilustracje z wyobrazni</h3>


  <!-- OBRAZ 01 -->

  <figure class="artwork">

    <div
      class="artwork-image"
      onclick="openLightbox(this)"
    >

      <img
        src="images/wyobraznia/wyobraznia-01.jpg"
        alt="Przejście"
        loading="lazy"
      >

    </div>


    <figcaption class="artwork-caption">

      <span class="artwork-number">
        01
      </span>

      <h3 class="artwork-title">
        Przejście
      </h3>

      <p class="artwork-description">
        Tam, gdzie kończy się znane.
      </p>

    </figcaption>

  </figure>






<!-- =====================================================
     POWIĘKSZENIE OBRAZU
     ===================================================== -->

<div
  class="lightbox"
  id="lightbox"
  onclick="closeLightbox()"
>

  <button
    class="lightbox-close"
    onclick="closeLightbox()"
    aria-label="Zamknij"
  >
    ×
  </button>


  <img
    id="lightbox-image"
    src=""
    alt=""
  >

</div>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer>

  <div class="container">

    <p>
      Biblioteka Adama Miksa
    </p>

    <p>
      © 2026 · Wszelkie prawa zastrzeżone
    </p>

  </div>

</footer>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>

function openLightbox(element) {

  const image =
    element.querySelector("img");

  const lightbox =
    document.getElementById("lightbox");

  const lightboxImage =
    document.getElementById("lightbox-image");


  lightboxImage.src =
    image.src;

  lightboxImage.alt =
    image.alt;


  lightbox.classList.add("active");

  document.body.style.overflow =
    "hidden";
}



function closeLightbox() {

  const lightbox =
    document.getElementById("lightbox");


  lightbox.classList.remove("active");

  document.body.style.overflow =
    "";
}



document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      closeLightbox();

    }

  }
);

</script>


</body>
</html>
```
